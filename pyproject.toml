[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-logging"
description = "Laboratory work for experiment tracking"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
lab-logging = "lab_logging.main:main"

[tool.setuptools.packages.find]
where = ["src"]
