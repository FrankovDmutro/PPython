name: Production CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-and-test:
    name: Lint, Test, Typecheck & Build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade Pip and Build Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Install Package in Editable Mode with Dev Dependencies
        run: |
          pip install -e "Lab_10[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check Lab_10

      - name: Run Ruff Format Verification
        run: |
          ruff format --check Lab_10

      - name: Run Static Type Checking (MyPy)
        run: |
          mypy Lab_10/src

      - name: Run Pytest Suite with Coverage Enforcement
        run: |
          pytest Lab_10/tests -v --cov=Lab_10/src/experiment_registry --cov-report=term-missing --cov-fail-under=85

      - name: Build Distribution Packages (Wheel and Sdist)
        run: |
          python -m build Lab_10

      - name: Verify Package Artifacts Existence
        run: |
          ls -la Lab_10/dist

      - name: Upload Package Artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: Lab_10/dist/

  docker-build:
    name: Build & Verify Docker Image
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: Lab_10
          file: Lab_10/Dockerfile
          push: false
          tags: experiment-registry:latest
