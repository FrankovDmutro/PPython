version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: experiment-registry:1.0.0
    container_name: experiment_registry_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Scientific Experiments Registry
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/experiments.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - experiment_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  experiment_data:
    name: experiment_registry_data
